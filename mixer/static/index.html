<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stem Mixer</title>
<style>
:root {
  --bg: #12161c; --panel: #1c222b; --panel2: #232a35; --line: #2c3440; --line2: #3a4452;
  --text: #eef1f5; --muted: #8d97a6; --dim: #5d6775;
  --accent: #45c6d6; --accent-bg: #1f4148; --warn: #e9a04b; --solo: #f2c94c;
  --cellw: 64px; --rowh: 72px; --radius: 14px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: radial-gradient(1200px 700px at 30% 40%, #1b222c, var(--bg)) fixed; background-color: var(--bg);
  color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .35; cursor: default; }
svg.i { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; min-height: 100dvh;
  padding: calc(14px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom)) 20px; }
.main { display: flex; flex-direction: column; min-width: 0; }

/* header */
.top { display: flex; align-items: center; gap: 14px; padding: 4px 4px 14px; min-width: 0; }
.cover { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--panel2); }
.ttl { min-width: 0; flex: 1; }
.ttl .t { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl .a { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.02); }
.pill button, .ib { width: 46px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.pill button:hover, .ib:hover { background: rgba(255,255,255,.06); }
.pill button.on, .ib.on { background: var(--accent-bg); color: var(--accent); }
.only-narrow { display: none !important; }

/* chord strip */
.strip { position: relative; height: 70px; overflow: hidden; border-radius: 12px; margin: 0 0 18px; flex: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 48px), transparent); }
.strip-inner { position: absolute; left: 0; top: 0; height: 100%; display: flex; gap: 10px; will-change: transform; }
.bar { display: flex; gap: 2px; height: 100%; border-radius: 10px; overflow: hidden; flex: none; }
.cell { width: var(--cellw); height: 100%; background: #3b434f; display: flex; align-items: center; padding-left: 12px;
  font-size: 22px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; flex: none; overflow: visible; }
.bar .cell:first-child { box-shadow: inset 4px 0 0 rgba(255,255,255,.22); }
.cell.chg { color: #fff; position: relative; z-index: 1; }
.cell { position: relative; }
.cell .sig { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.cell.now .sig { color: #1d7f8c; }
.cell.rep { color: #9aa3b0; }
.cell.now { background: #fff; color: #12161c; }
.strip-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

/* tracks */
.tracks { display: flex; flex-direction: column; gap: 12px; }
.trk { display: grid; grid-template-columns: 52px minmax(110px, 34%) minmax(0, 1fr) 40px; align-items: center; gap: 14px; position: relative; }
.trk .icon { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; color: var(--text); position: relative; }
.trk .icon svg.i { width: 32px; height: 32px; }
.trk.off .icon, .trk.off .vol { opacity: .38; }
.trk .icon .badge { position: absolute; right: 2px; top: 2px; font-size: 10px; font-weight: 800; color: #12161c; background: var(--solo);
  border-radius: 6px; padding: 0 4px; line-height: 15px; display: none; }
.trk.solo .icon .badge { display: block; }
.trk.muted .icon::after { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: var(--warn); transform: rotate(-35deg); border-radius: 1px; }
.vol { position: relative; }
.vol .val { position: absolute; right: 0; top: -12px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s; pointer-events: none; }
.vol.drag .val { opacity: 1; }
.wave { height: var(--rowh); width: 100%; border-radius: var(--radius); display: block; touch-action: pan-y; cursor: pointer; }
.trk .menu { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); }
.trk .menu:hover { background: rgba(255,255,255,.06); color: var(--text); }
.trk.waiting::before { content: ""; position: absolute; left: -10px; top: 18px; bottom: 18px; width: 3px; border-radius: 2px; background: var(--warn); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, #f3f5f8 var(--fill, 100%), #48515e var(--fill, 100%)); }
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: #48515e; }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: #f3f5f8; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6.5px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; }

/* chord chart */
.chart { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding-bottom: 8px; }
.chart .cb { background: var(--panel2); border-radius: 10px; padding: 10px 12px; min-height: 64px; cursor: pointer; position: relative;
  scroll-margin: 20px 0 200px; }   /* keep the current bar clear of the sticky bottom bar */
.chart .cb .n { position: absolute; right: 8px; top: 6px; font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chart .cb .sg { position: absolute; left: 12px; top: 4px; font-size: 10.5px; font-weight: 700; color: var(--accent); }
.chart .cb:has(.sg) .c { margin-top: 8px; }
.chart .cb .c { font-size: 20px; font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; }
.chart .cb.now { background: #fff; color: #12161c; }
.chart .cb.now .n { color: #55606e; }
.chart .cb .bt { display: flex; gap: 3px; margin-top: 8px; }
.chart .cb .bt i { flex: 1; height: 3px; border-radius: 2px; background: var(--line2); }
.chart .cb.now .bt i.on { background: var(--accent); }
.empty { color: var(--muted); padding: 24px 4px; }

/* chips */
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 18px; }
.chip { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 14px; border-radius: 26px; border: 1px solid var(--line2); color: var(--text); }
.chip svg.i { width: 26px; height: 26px; }
.chip.on { border-color: var(--accent); background: var(--accent-bg); color: #fff; }

/* bottom bar */
.bar-wrap { margin-top: auto; position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
.bbar { background: rgba(28,34,43,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line);
  border-radius: 22px; padding: 14px 18px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.brow { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.grp { display: flex; align-items: center; gap: 4px; }
.box { height: 46px; min-width: 92px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.02);
  font-size: 17px; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.box.mod { border-color: var(--accent); color: var(--accent); }
.transport { gap: 18px; }
.transport .ib svg.i { width: 34px; height: 34px; fill: currentColor; stroke: none; }
.transport .play svg.i { width: 40px; height: 40px; }
.ib.cnt { font-size: 11px; font-weight: 700; line-height: 1.05; letter-spacing: .1em; text-align: center; }
.progress { display: grid; grid-template-columns: 56px 1fr 62px; align-items: center; gap: 14px; margin-top: 10px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.progress span:last-child { text-align: right; }
.seek { position: relative; height: 24px; cursor: pointer; touch-action: none; }
.seek .tr { position: absolute; left: 0; right: 0; top: 50%; height: 5px; margin-top: -2.5px; border-radius: 3px; background: #48515e; overflow: hidden; }
.seek .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #f3f5f8; width: 0; }
.seek .lp { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; background: rgba(69,198,214,.28); border: 1px solid rgba(69,198,214,.7); display: none; }

/* side panel */
.side { background: rgba(28,34,43,.6); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 14px; align-self: start; max-height: calc(100dvh - 28px); overflow: auto; }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; font-weight: 700; font-size: 17px; }
.song { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; text-align: left; width: 100%; }
.song:hover { background: rgba(255,255,255,.04); }
.song.cur { background: var(--panel2); }
.song img, .song .ph { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--panel2); }
.song .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song > div { min-width: 0; }
.app.side-closed { grid-template-columns: minmax(0, 1fr); }
.app.side-closed .side { display: none; }
.app.side-closed .only-closed { display: grid !important; }
.only-closed { display: none !important; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; }

/* popover / toast */
.pop { position: fixed; z-index: 30; width: min(360px, calc(100vw - 24px)); background: #222934; border: 1px solid var(--line2); border-radius: 16px;
  padding: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); max-height: calc(100dvh - 40px); overflow: auto; }
.pop h3 { margin: 0 0 10px; font-size: 15px; }
.pop .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.pop .row > label { flex: none; width: 6.5em; color: var(--muted); font-size: 13px; }
.pop .row > .v { min-width: 4.4em; text-align: right; font-variant-numeric: tabular-nums; }
.pop .big { font-size: 26px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; flex: 1; }
.pop .sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(255,255,255,.03); white-space: nowrap; }
.btn.on { background: var(--accent-bg); border-color: var(--accent); color: #fff; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #0d1a1d; font-weight: 700; }
.btn.sq { width: 40px; padding: 0; font-size: 20px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -160%); background: #2b3340; border: 1px solid var(--line2);
  padding: 10px 16px; border-radius: 12px; z-index: 40; transition: transform .25s; max-width: calc(100vw - 32px); font-size: 14px; }
.toast.show { transform: translate(-50%, 0); }

/* library */
.player { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.app.lib-mode { grid-template-columns: minmax(0, 1fr); }
.app.lib-mode .side, .app.lib-mode .scrim { display: none !important; }
.top .back { flex: none; width: 36px; margin-left: -6px; }
.lib { padding: 8px 4px 120px; }
.lib h1 { font-size: 34px; margin: 18px 0 22px; }
.lib-tools { display: flex; gap: 12px; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 16px; }
.btn.add { flex: none; height: 52px; padding: 0 22px; display: flex; align-items: center; gap: 8px; font-size: 16px; border-radius: 14px; }
.btn.add svg.i { width: 22px; height: 22px; }
.lib-bar { display: flex; justify-content: space-between; align-items: center; margin: 20px 2px 6px; color: var(--muted); font-size: 14px; }
.sortb { color: var(--muted); font-size: 14px; }
.lib-head, .lrow { display: grid; grid-template-columns: 60px minmax(0, 2.4fr) minmax(0, 1.4fr) 70px 110px 64px 40px; gap: 14px; align-items: center; }
.lib-head { color: var(--dim); font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.lrow { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.04); cursor: pointer; border-radius: 10px; }
.lrow:hover { background: rgba(255,255,255,.03); }
.lrow img, .lrow .ph { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: var(--panel2); display: grid; place-items: center; color: var(--dim); }
.lrow .t { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow.cur .t { color: var(--accent); }
.lrow .a, .lrow .n { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.lrow .sub { display: none; }
.lrow .menu { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); }
.lrow.job { cursor: default; }
.lrow.job .st { color: var(--muted); font-size: 13px; }
.lrow.job.err .st { color: #ef8a8a; }
.pbar { height: 4px; border-radius: 2px; background: var(--line2); overflow: hidden; margin-top: 6px; }
.pbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.lrow.job .btns { justify-content: flex-end; }
.lib-hint { color: var(--dim); font-size: 13px; margin: 18px 2px; }
.lib-empty { color: var(--muted); padding: 30px 4px; }
.mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(640px, calc(100vw - 24px));
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 22px; background: rgba(34,41,52,.95); border: 1px solid var(--line2);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 6; }
.mini img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--panel2); }
.mini-t { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
.mini-t .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mini-t .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mini .ib svg.i { width: 28px; height: 28px; fill: currentColor; stroke: none; }
.drop { position: fixed; inset: 0; z-index: 50; background: rgba(18,22,28,.8); display: grid; place-items: center; }
.drop div { border: 2px dashed var(--accent); border-radius: 20px; padding: 60px 80px; font-size: 20px; color: var(--accent); }
@media (max-width: 760px) {
  .lib h1 { font-size: 26px; margin: 8px 0 14px; }
  .lib-tools { gap: 8px; }
  .search, .btn.add { height: 46px; }
  .btn.add { padding: 0 14px; }
  .lib-head { display: none; }
  .lrow { grid-template-columns: 52px minmax(0, 1fr) auto 32px; gap: 10px; }
  .lrow img, .lrow .ph { width: 52px; height: 52px; }
  .lrow .a.col, .lrow .n.col { display: none; }
  .lrow .sub { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .meta { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .lrow .menu { width: 32px; }
}
@media (min-width: 761px) { .lrow .meta { display: none; } }

/* separation running for the song in the player */
.pjob { display: grid; grid-template-columns: auto 1fr 3.4em; gap: 12px; align-items: center; margin: -6px 0 14px; color: var(--muted); font-size: 13px; }
.pjob .pbar { margin-top: 0; height: 6px; }
.pjob .pp { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

/* falling notes */
.notesv { display: flex; flex-direction: column; gap: 8px; }
.nbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.nparts { display: flex; gap: 6px; flex-wrap: wrap; }
.npart { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 17px; border: 1px solid var(--line2); font-size: 13.5px; }
.npart i { width: 12px; height: 12px; border-radius: 3px; }
.npart.off { opacity: .4; }
.nstat { color: var(--muted); font-size: 13px; min-height: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.nprog { display: grid; grid-template-columns: minmax(70px, 9em) 1fr 3.4em; align-items: center; gap: 10px; }
.nprog .pbar { margin-top: 0; height: 6px; border-radius: 3px; }
.nprog .pbar i { transition: width .35s linear; }
.nprog .np { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
#nCanvas { width: 100%; height: clamp(300px, calc(100dvh - 380px), 900px); border-radius: 14px; background: #10141a; display: block; }
@media (max-width: 760px) { #nCanvas { height: clamp(240px, calc(100dvh - 500px), 700px); } .nbar .btn { height: 36px; padding: 0 10px; font-size: 13px; } }

/* separation settings sheet */
.modal { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px; }
.sheet { width: min(980px, 100%); height: min(860px, 100%); background: #1f242c; border: 1px solid var(--line); border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.sheet header { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; padding: 16px 16px 4px; }
.sheet header .mt { text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib.round { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line2); }
.sheet-body { flex: 1; overflow: auto; padding: 4px 24px 16px; }
.sheet h2 { font-size: 24px; font-weight: 600; margin: 22px 0 14px; }
.opt { width: 100%; display: flex; align-items: center; gap: 16px; padding: 0 22px; min-height: 76px; border-radius: 14px; background: #2b313a; margin-bottom: 12px; text-align: left; color: var(--text); }
.opt svg.i { width: 30px; height: 30px; flex: none; }
.opt .ol { flex: 1; min-width: 0; }
.opt .ol b { font-weight: 500; font-size: 16px; display: block; }
.opt .ol small { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
.opt .ck { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; flex: none; }
.opt .ck svg.i { width: 18px; height: 18px; }
.opt.on { background: #f4f6f8; color: #14181e; }
.opt.on .ol small { color: #5d6672; }
.opt.on .ck { background: #dfe3e8; border-color: transparent; color: #14181e; }
.opt.part.on { background: #2b313a; color: var(--text); box-shadow: inset 0 0 0 2px var(--accent); }
.opt.part.on .ck { background: var(--accent); color: #0d1a1d; }
.opt .chev { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); flex: none; }
.opt .chev svg.i { width: 22px; height: 22px; transition: transform .2s; transform: rotate(-90deg); }   /* ﹀ closed */
.opt .chev.open svg.i { transform: rotate(90deg); }
.sub-opts { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 14px 68px; }
.sheet footer { padding: 12px 24px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: grid; gap: 10px; }
.hifi { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; cursor: pointer; }
.hifi .hl { display: flex; align-items: center; gap: 6px; font-weight: 800; letter-spacing: .06em; }
.hifi .hl svg.i { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.hifi .hs { color: var(--muted); font-size: 12.5px; }
.hifi input { display: none; }
.switch { width: 56px; height: 32px; border-radius: 16px; background: #4a525e; position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.hifi input:checked + .switch { background: var(--accent); }
.hifi input:checked + .switch::after { transform: translateX(24px); }
.sheet .sum { color: var(--muted); font-size: 13px; text-align: center; }
.btn.send { height: 56px; font-size: 17px; border-radius: 14px; }
@media (max-width: 760px) {
  .modal { padding: 0; }
  .sheet { border-radius: 0; height: 100%; border: 0; }
  .sheet header { padding-top: calc(10px + env(safe-area-inset-top)); }
  .sheet-body { padding: 0 14px 12px; }
  .sheet h2 { font-size: 20px; margin: 16px 0 10px; }
  .opt { min-height: 64px; padding: 0 14px; gap: 12px; margin-bottom: 9px; }
  .sub-opts { margin-left: 14px; }
  .sheet footer { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
  .hifi .hs { font-size: 11.5px; }
}

/* narrower screens: the song list becomes a drawer */
@media (max-width: 1100px) {
  .app, .app.side-closed { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side, .app.side-closed .side { position: fixed; right: 0; top: 0; bottom: 0; width: min(340px, 86vw); max-height: none; border-radius: 20px 0 0 20px; z-index: 21;

  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; }
  .only-narrow, .app.side-closed .only-narrow { display: grid !important; }
}
@media (max-width: 760px) {
  :root { --cellw: 48px; --rowh: 52px; --radius: 11px; }

  .ttl .a { font-size: 13px; }

  .bbar { padding: 10px 10px 8px; border-radius: 18px; }
  .brow { flex-wrap: wrap; row-gap: 6px; }
  .brow .left { order: 1; }
  .brow .views { order: 2; }
  .brow .bpm { order: 3; min-width: 78px; font-size: 15px; height: 42px; padding: 0 8px; }

<body>
<div class="app" id="app">
  <div class="main">
    <section class="lib" id="library" hidden>
      <h1>ライブラリ</h1>
      <div class="lib-tools">

        <button class="btn pri add" id="bAdd"><span id="addIcon"></span>追加</button>

      <img class="cover" id="cover" alt="">

    <div class="pjob" id="pJob" hidden><span class="pl"></span><div class="pbar"><i></i></div><span class="pp"></span></div>
    <section class="tracks" id="vMixer"></section>
    <section id="vChart" hidden></section>
    <section id="vNotes" class="notesv" hidden>
      <div class="nbar">
        <div class="nparts" id="nParts"></div>
        <div class="grp">
          <button class="btn" id="nMake">MIDI を作る</button>
          <button class="btn" id="nOpts">表示</button>
          <button class="btn" id="nSave">MIDI 保存</button>
        </div>
      </div>
      <div class="nstat" id="nStat"></div>
      <canvas id="nCanvas" aria-label="ノーツ表示"></canvas>
    </section>

    <div class="chips" id="chips"></div>

    <div class="bar-wrap">
      <div class="bbar">
        <div class="brow">
          <div class="grp left">
            <button class="ib" id="bMetro" title="メトロノーム (M)" aria-label="メトロノーム"></button>
            <button class="ib cnt" id="bCount" title="カウントイン（再生前に1小節）" aria-label="カウントイン">1 2<br>3 4</button>
            <button class="ib" id="bRegion" title="区間（A-B）" aria-label="区間"></button>
            <button class="ib" id="bLoop" title="区間をループ (L)" aria-label="ループ"></button>
          </div>
          <button class="box bpm" id="bBpm" title="テンポ">– BPM</button>
          <div class="grp transport">
            <button class="ib" id="bBack" title="5秒戻る (←)" aria-label="5秒戻る"></button>
            <button class="ib play" id="bPlay" title="再生 / 停止 (Space)" aria-label="再生"></button>
            <button class="ib" id="bFwd" title="5秒進む (→)" aria-label="5秒進む"></button>
          </div>
          <button class="box key" id="bKey" title="キー（移調）">–</button>
          <div class="pill views">

            <button id="bViewChart" title="コード表" aria-label="コード表"></button>
            <button id="bViewNotes" title="ノーツ（MIDI）" aria-label="ノーツ"></button>

        </div>

          <span id="tRem">-00:00</span>

      </div>
    </div>
    </div>
  </div>

  <aside class="side" id="side">

  <div class="scrim" id="scrim"></div>
</div>

    <footer>

        <input type="checkbox" id="sepHifi"><span class="switch"></span></label>
      <div class="sum" id="sepSum"></div>
      <button class="btn pri send" id="sepSend">送信</button>
    </footer>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast"></div>

let lastDrawPos = -1;
function frame() {

  dirty = false; lastDrawPos = p;

    const t1 = i + 1 < B.t.length ? B.t[i + 1] : B.t[i] + (B.t[i] - B.t[Math.max(0, i - 1)] || 0.5);

  const boxes = $("vChart").querySelectorAll(".cb");

}
const isBlack = (p) => [1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12);
function keyLayout(lo, hi, w) {
  let whites = 0; for (let p = lo; p <= hi; p++) if (!isBlack(p)) whites++;
  const W = w / whites, x = {}, wd = {};
  let k = 0;
  for (let p = lo; p <= hi; p++) {
    if (!isBlack(p)) { x[p] = k * W; wd[p] = W; k++; } else { x[p] = k * W - W * 0.32; wd[p] = W * 0.64; }
  }

}
function drawNotes(now) {
  const c = $("nCanvas"); if (!c || c.offsetParent === null) return;
  const dpr = window.devicePixelRatio || 1, w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d");
  g.fillStyle = "#10141a"; g.fillRect(0, 0, w, h);
  const ids = doneTracks().map(([id]) => id).filter(isShown);
  // keyboard range: the notes in view (at least 3 octaves), snapped to whole octaves
  let lo = 108, hi = 21;
  for (const id of ids) for (const n of notesData[id].notes) { if (n[2] + semi < lo) lo = n[2] + semi; if (n[2] + semi > hi) hi = n[2] + semi; }
  if (lo > hi) { lo = 48; hi = 84; }
  lo = Math.max(21, lo - (lo % 12) - 0); hi = Math.min(108, hi + (11 - (hi % 12)) + 1);
  if (hi - lo < 36) { const mid = (lo + hi) / 2; lo = Math.max(21, Math.round(mid - 18) - (Math.round(mid - 18) % 12)); hi = Math.min(108, lo + 36); }
  const L = keyLayout(lo, hi, w);
  const kh = Math.min(120 * dpr, h * 0.2), y0 = h - kh, pps = y0 / nPrefs.win;
  // octave guides and bar lines
  g.fillStyle = "rgba(255,255,255,.035)";
  for (let p = lo; p <= hi; p++) if (p % 12 === 0) g.fillRect(L.x[p], 0, 1 * dpr, y0);
  if (B) {
    g.font = `${11 * dpr}px system-ui`; g.textBaseline = "bottom";
    B.bars.forEach(([i0], bi) => {
      const t = B.t[i0]; if (t < now - 0.05 || t > now + nPrefs.win) return;
      const y = y0 - (t - now) * pps;
      g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, y, w, 1 * dpr);
      g.fillStyle = "rgba(255,255,255,.35)"; g.fillText(String(bi + (B.pickup ? 0 : 1)), 6 * dpr, y - 2 * dpr);
    });
  }
  // notes
  const active = {};
  for (const id of ids) {
    const P = prepared(id), col = trackColor(id);
    let i = lowerBound(P.starts, now - P.maxDur - 0.1);
    for (; i < P.ns.length && P.ns[i][0] <= now + nPrefs.win; i++) {
      const [s, e, p0, v] = P.ns[i], p = p0 + semi;
      if (e < now || p < lo || p > hi) continue;
      const yb = y0 - (s - now) * pps, yt = y0 - (e - now) * pps;
      const x = L.x[p] + L.wd[p] * 0.08, ww = L.wd[p] * 0.84;
      const top = Math.max(0, yt), bot = Math.min(y0, yb);
      if (bot <= top) continue;

      if (yb <= y0 + 1 && yb >= top) {          // the press: a light band at the bottom edge of the note
        g.fillStyle = "rgba(255,255,255,.55)";
        g.fillRect(x + 1 * dpr, Math.max(top, yb - 3 * dpr), ww - 2 * dpr, 2 * dpr);

  for (let p = lo; p <= hi; p++) if (!isBlack(p)) {
    g.fillStyle = active[p] || "#f4f1e8"; g.fillRect(L.x[p] + 0.5 * dpr, y0, L.W - 1 * dpr, kh);
    if (p % 12 === 0) { g.fillStyle = active[p] ? "#14181e" : "#8a8f98"; g.font = `${Math.max(8, Math.min(12, L.W / dpr * 0.45)) * dpr}px system-ui`; g.textAlign = "center"; g.textBaseline = "bottom"; g.fillText(`C${p / 12 - 1}`, L.x[p] + L.W / 2, h - 4 * dpr); g.textAlign = "left"; }
  }
  for (let p = lo; p <= hi; p++) if (isBlack(p)) {
    g.fillStyle = active[p] || "#1b1d22"; g.fillRect(L.x[p], y0, L.wd[p], kh * 0.62);

  // hit line glow
  g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(0, y0 - 1 * dpr, w, 2 * dpr);

    const grd = g.createRadialGradient(L.x[p] + L.wd[p] / 2, y0, 0, L.x[p] + L.wd[p] / 2, y0, L.W * 1.2);

    g.fillStyle = "#8d97a6"; g.font = `${14 * dpr}px system-ui`; g.textAlign = "center";
    g.fillText(doneTracks().length ? "表示するパートを選んでください" : "「MIDI を作る」でパートを MIDI にすると、ここにノーツが落ちてくる", w / 2, y0 / 2); g.textAlign = "left";
  }
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
}

// ---- Standard MIDI File: one track per part, tempo map and time signatures from the beat grid
function saveMidi() {
  const ids = doneTracks().map(([id]) => id).filter(isShown);
  if (!ids.length || !B) { toast("保存する MIDI がありません"); return; }
  const PPQ = 480, m = mainMeter(), compound = [6, 9, 12].includes(m) && B.bpm >= 130, fast = signature(m, B.bpm).endsWith("/8");
  const tpp = fast ? PPQ / 2 : PPQ;               // ticks per pulse: pulses are eighths in x/8 meters
  const t = B.t, n = t.length;
  const t0Ticks = Math.max(0, Math.round(t[0] / (t[1] - t[0]))) * tpp;   // whole pulses before the first beat
  const tick = (sec) => {
    if (sec < t[0]) return t[0] > 0 ? Math.max(0, Math.round(sec / t[0] * t0Ticks)) : 0;
    return Math.round(t0Ticks + secToPos(sec) * tpp);
  };
  const vlq = (v) => { const b = [v & 0x7f]; while ((v >>= 7)) b.unshift((v & 0x7f) | 0x80); return b; };
  const u32 = (v) => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const chunk = (evs) => {
    evs.sort((a, b) => a.tick - b.tick || a.ord - b.ord);
    const bytes = []; let last = 0;
    for (const e of evs) { bytes.push(...vlq(e.tick - last), ...e.data); last = e.tick; }
    bytes.push(0, 0xff, 0x2f, 0);
    return [0x4d, 0x54, 0x72, 0x6b, ...u32(bytes.length), ...bytes];
  };
  const text = (type, s) => { const b = [...new TextEncoder().encode(s)]; return [0xff, type, ...vlq(b.length), ...b]; };
  // conductor track
  const cond = [{ tick: 0, ord: 0, data: text(0x03, song.name.normalize("NFKC")) }];
  const usPerQ = (sec) => Math.round(sec * 1e6 * (PPQ / tpp));
  const tempoEv = (tk, us) => ({ tick: tk, ord: 1, data: [0xff, 0x51, 3, (us >> 16) & 255, (us >> 8) & 255, us & 255] });
  if (t0Ticks > 0) cond.push(tempoEv(0, usPerQ(t[0] / (t0Ticks / tpp))));
  let lastUs = 0;
  for (let i = 0; i < n - 1; i++) {
    const us = usPerQ(t[i + 1] - t[i]);
    if (us <= 0 || us > 0xffffff) continue;        // a broken grid must not write tempo 0
    if (Math.abs(us - lastUs) > lastUs * 0.004) { cond.push(tempoEv(t0Ticks + i * tpp, us)); lastUs = us; }
  }
  let lastSig = "";
  for (const [i0, i1] of B.bars) {
    const sig = signature(i1 - i0, B.bpm);
    if (sig === lastSig || i1 - i0 < 2) continue;
    const [num, den] = sig.split("/").map(Number);
    cond.push({ tick: t0Ticks + i0 * tpp, ord: 2, data: [0xff, 0x58, 4, num, Math.log2(den), den === 8 ? 12 : 24, 8] });
    lastSig = sig;
  }
  const tracksOut = [chunk(cond)];
  ids.forEach((id, k) => {
    const ch = k >= 9 ? k + 1 : k;                 // skip channel 10 (drums)
    const prog = GM_PROGRAM[KIND[notesData[id].part] || "other"];
    // English part names: Japanese DAWs read track names as Shift_JIS, others as UTF-8
    const evs = [{ tick: 0, ord: 0, data: text(0x03, notesData[id].part) }, { tick: 0, ord: 1, data: [0xc0 | (ch & 15), prog] }];
    for (const [s, e, p0, v] of prepared(id).ns) {
      const p = Math.max(0, Math.min(127, p0 + semi)), a = tick(s), b = Math.max(a + 1, tick(e));
      evs.push({ tick: a, ord: 3, data: [0x90 | (ch & 15), p, v] }, { tick: b, ord: 2, data: [0x80 | (ch & 15), p, 0] });
    }
    tracksOut.push(chunk(evs));
  });
  const head = [0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 1, 0, tracksOut.length, (PPQ >> 8) & 255, PPQ & 255];
  const blob = new Blob([new Uint8Array([...head, ...tracksOut.flat()])], { type: "audio/midi" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `${song.name}${semi ? `_${semi > 0 ? "+" : ""}${semi}` : ""}.mid`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`MIDI を保存しました（${ids.length} パート${nPrefs.quant ? "・クオンタイズ" : ""}${semi ? "・移調" : ""}）`);
}
$("nMake").onclick = makePop;
$("nOpts").onclick = optsPop;
$("nSave").onclick = saveMidi;

/* ================================================================ wiring */
function setIcons() {
  const set = (id, k) => { $(id).innerHTML = svg(UI_ICON[k]); };
  set("bReset", "reset"); set("bDownload", "download"); set("bMore", "more"); set("bList", "list"); set("bSide", "panel");
  set("bMetro", "metro"); set("bRegion", "region"); set("bLoop", "loop"); set("bBack", "back"); set("bFwd", "fwd");
  set("bViewMixer", "mixer"); set("bViewChart", "chart"); set("bViewNotes", "notes");
  set("bLib", "chevron"); set("searchIcon", "search"); set("addIcon", "plus"); set("miniBack", "back"); set("miniFwd", "fwd");
  set("sepClose", "chevron"); set("hifiIcon", "bolt");
}
const relayout = () => setTimeout(() => { measureStrip(); tracks.forEach(buildWave); }, 50);
$("bPlay").onclick = togglePlay;
$("bBack").onclick = () => seekTo(currentPos() - 5 * SR);
$("bFwd").onclick = () => seekTo(currentPos() + 5 * SR);
$("bMetro").onclick = () => {
  prefs.metroOn = !prefs.metroOn; savePrefs(); drawToggles();
  if (!playing) return;
  if (prefs.metroOn) segs.forEach(scheduleClicks);
  else for (const s of segs) { stopNodes(s.clicks); s.clicks = []; s.clicked = false; }
};
$("bCount").onclick = () => { prefs.countIn = !prefs.countIn; savePrefs(); drawToggles(); toast(prefs.countIn ? "再生前に1小節カウントします" : "カウントインなし", 1500); };
$("bLoop").onclick = () => {
  if (!hasRegion()) { toast("波形を横にドラッグするか、✂ で区間を決めてください"); return; }
  loopOn = !loopOn; loopChanged();
};
$("bRegion").onclick = regionPop;
$("bBpm").onclick = bpmPop;
$("bKey").onclick = keyPop;
$("bDownload").onclick = downloadPop;
$("bMore").onclick = morePop;
$("bReset").onclick = () => {
  for (const t of tracks) Object.assign(t, { db: 0, mute: false, solo: false, pan: 0, shown: t.group === "mix" });
  renderRows(); renderChips();
  if (wantTempo !== 1 || wantSemi !== 0) requestVariant(1, 0, 0);
  toast("ミックス・テンポ・キーを元に戻しました");
};
$("bViewMixer").onclick = () => { prefs.view = "mixer"; savePrefs(); drawToggles(); relayout(); };
$("bViewChart").onclick = () => { prefs.view = "chart"; savePrefs(); drawToggles(); curCell = -2; curBar = -1; dirty = true; };

const narrow = () => matchMedia("(max-width: 1100px)").matches;
$("bList").onclick = () => {
  if (narrow()) $("app").classList.add("drawer");
  else { prefs.sideClosed = false; savePrefs(); $("app").classList.remove("side-closed"); relayout(); }
};
$("bSide").onclick = () => {
  if (narrow()) $("app").classList.remove("drawer");
  else { prefs.sideClosed = true; savePrefs(); $("app").classList.add("side-closed"); relayout(); }
};
$("scrim").onclick = () => $("app").classList.remove("drawer");
(() => {   // seek bar: tap or drag
  const s = $("seek"); let on = false;
  const at = (e) => { const r = s.getBoundingClientRect(); return Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * total); };
  s.addEventListener("pointerdown", (e) => { on = true; try { s.setPointerCapture(e.pointerId); } catch {} if (!playing) { pausedPos = at(e); dirty = true; } });
  s.addEventListener("pointermove", (e) => { if (on && !playing) { pausedPos = at(e); dirty = true; } });
  s.addEventListener("pointerup", (e) => { if (on) { on = false; seekTo(at(e)); } });
  s.addEventListener("pointercancel", () => { on = false; });
})();
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowLeft") $("bBack").click();
  else if (e.code === "ArrowRight") $("bFwd").click();
  else if (e.code === "KeyL") $("bLoop").click();
  else if (e.code === "KeyM") $("bMetro").click();
  else if (e.code === "Escape") { closePop(); $("sep").hidden = true; }
});
window.addEventListener("resize", () => { measureStrip(); placePop(); });
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("play", () => { if (!playing) togglePlay(); });
    navigator.mediaSession.setActionHandler("pause", () => { if (playing) togglePlay(); });
  } catch {}
}

(async () => {
  setIcons(); drawPlay(); drawToggles();
  if (prefs.sideClosed) $("app").classList.add("side-closed");
  try {
    const r = await fetch("/api/songs", { credentials: "same-origin" });
    if (!r.ok) throw new Error(await r.text());
    songs = await r.json();
  } catch (err) { toast("曲一覧を読み込めません: " + err.message, 0); return; }
  setInterval(tick, 100);
  requestAnimationFrame(frame);
  // the last song is loaded (paused) so the mini player can resume it; the URL decides the view
  const last = store.get("song");
  const m = location.hash.match(/^#\/song\/(.+)$/);
  if (!m && songs.some((s) => s.dir === last)) await openSong(last);
  route();
})();
